# KTP Tier 1 — Build-time smoke for KTPAmxxCurl
#
# Catches the 2026-04-14 regression class — KTPAmxxCurl missing source file
# / broken CMakeLists / symbol breakage causes amxxcurl_ktp_i386.so to
# silently fail to load on the game server, cascading every plugin that uses
# ktp_discord.inc into "bad load."
#
# Implementation lives in the reusable workflow at
# KTPInfrastructure/.github/workflows/smoke-callable.yml. This file is just
# the trigger + assertion configuration.
#
# See KTPInfrastructure/tests/smoke/README.md for the full design.

name: Tier 1 Smoke

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  # CU-02 regression gate. The smoke job below proves the module LOADS; it cannot
  # see a transfer that stalls, because nothing in it performs one. This job drives
  # the real CurlMulti/AsioPoller against a loopback HTTP server and fails if a
  # readiness event is dropped -- the defect fixed in 1.3.17, which presented as
  # CURLE_OPERATION_TIMEDOUT with a partial body and no error a plugin could see.
  #
  # Deliberately NOT in the Docker smoke image: the harness links the committed
  # vendored static libs directly, so a stock runner plus multilib is the whole
  # requirement. Keeping it here also means it runs on doc-free pushes and PRs
  # under the same triggers as the smoke job.
  harness:
    name: CurlMulti re-arm harness (CU-02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The module ships i386, and the vendored .a files are 32-bit, so the harness
      # builds -m32. Without multilib the link fails with a bare "cannot find -lz",
      # which reads like a missing dependency rather than a missing toolchain.
      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib g++-multilib

      # Exit codes: 0 GREEN, 1 RED (event dropped / transfer did not complete),
      # 2 INCONCLUSIVE (the INOUT overlap never formed, so the run proves nothing).
      # 2 must fail the job -- a harness that silently stops exercising the defect
      # is the failure mode this gate exists to prevent, and it would otherwise
      # look identical to a pass.
      - name: Run harness
        run: bash tests/build_harness.sh

  smoke:
    uses: afraznein/KTPInfrastructure/.github/workflows/smoke-callable.yml@main
    with:
      under_test_label: KTPAmxxCurl
      under_test_kind: cpp_module
      # GitHub repo is `KTPAMXXCurl` (different casing) but Makefile +
      # build/curl/Dockerfile expect the local-convention `KTPAmxxCurl/`.
      # Pin the local checkout path so build context matches.
      caller_repo_path: KTPAmxxCurl
      make_build_target: build-curl
      artifact_host_path: KTPInfrastructure/artifacts/ci/ktpamx/modules/amxxcurl_ktp_i386.so
      artifact_container_path: /opt/hlds/dod/addons/ktpamx/modules/amxxcurl_ktp_i386.so
      assert_module: amxxcurl
    secrets:
      ktp_checkout_token: ${{ secrets.KTP_CHECKOUT_TOKEN }}
